<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift Note - The Whispering Shelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF8F0;
      --card-bg: #F5F1EB;
      --card-hover: #EDE8E0;
      --white: #FFFFFF;
      --primary: #34524F;
      --primary-dark: #2a4240;
      --accent: #D4B57A;
      --text: #3A3632;
      --text-muted: #D4CFC9;
      --text-faint: #C8C0B6;
      --danger: #B85C5C;
      --border: #F5F1EB;
      --font-serif: 'Lora', serif;
      --font-sans: 'Oxygen', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    header {
      background: var(--primary);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .date {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .header-icon-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
    }

    .header-icon-btn:hover {
      background: rgba(255,255,255,0.15);
      color: var(--white);
    }

    .settings-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .settings-btn:hover {
      background: rgba(255,255,255,0.15);
      color: var(--white);
    }

    .shift-info {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 12px;
      flex-wrap: nowrap;
      flex-shrink: 0;
      background: transparent;
    }

    .shift-field {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shift-field label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .shift-field input,
    .shift-field select {
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 14px;
      background: rgba(255,255,255,0.15);
      color: var(--white);
      transition: background 0.2s;
    }

    .shift-field input::placeholder { color: rgba(255,255,255,0.4); }
    .shift-field input:focus,
    .shift-field select:focus { outline: none; background: rgba(255,255,255,0.25); }
    .shift-field input[type="text"] { width: 90px; }
    .shift-field input[type="number"] { width: 60px; text-align: center; }
    .shift-field select { cursor: pointer; min-width: 70px; width: auto; white-space: nowrap; }
    .shift-field select option { color: var(--text); background: var(--white); }

    .assignee-dropdown {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--white);
      transition: background 0.2s;
      user-select: none;
    }

    .assignee-dropdown:hover { background: rgba(255,255,255,0.25); }

    .assignee-dropdown-display {
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .assignee-dropdown-arrow {
      font-size: 10px;
      opacity: 0.6;
    }

    .assignee-dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      min-width: 100px;
      z-index: 100;
      overflow: hidden;
    }

    .assignee-dropdown-menu.open { display: block; }

    .assignee-dropdown-item {
      padding: 8px 14px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .assignee-dropdown-item:hover { background: var(--card-bg); }
    .assignee-dropdown-item.selected { background: var(--primary); color: var(--white); }

    .shift-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.2);
    }

    /* ===== BUTTONS ===== */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .btn-primary { background: var(--primary); color: var(--white); }
    .btn-primary:hover { background: var(--primary-dark); }

    .btn-sm { padding: 6px 12px; font-size: 13px; }

    .btn-ghost {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.3);
      color: var(--white);
    }

    .btn-ghost:hover { background: rgba(255,255,255,0.15); }

    /* ===== SYNC STATUS ===== */
    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
      opacity: 0.6;
    }

    .sync-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-faint);
    }

    .sync-status .dot.local { background: var(--accent); }
    .sync-status .dot.cloud { background: var(--primary); }
    .sync-status .dot.error { background: var(--danger); }

    /* ===== BOARD ===== */
    .board {
      display: flex;
      gap: 16px;
      padding: 20px 20px 0;
      overflow-x: auto;
      flex: 1;
      align-items: flex-start;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      flex-shrink: 0;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .footer-links-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text);
      opacity: 0.5;
    }

    .footer-link {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .footer-link:hover {
      background: rgba(52, 82, 79, 0.1);
    }

    .footer-link-delete {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .footer-link:hover + .footer-link-delete,
    .footer-link-delete:hover {
      opacity: 0.6;
    }

    .footer-add-link {
      background: var(--primary);
      border: none;
      color: var(--white);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .footer-add-link:hover {
      background: var(--primary-dark);
    }

    .footer-link-form {
      position: fixed;
      bottom: 50px;
      right: 20px;
      background: var(--white);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 100;
    }

    .footer-link-form input {
      padding: 6px 10px;
      border: 1.5px solid var(--text-muted);
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 13px;
      background: var(--card-bg);
      color: var(--text);
    }

    .footer-link-form input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .footer-link-form .btn {
      padding: 5px 10px;
      font-size: 12px;
    }

    /* ===== COLUMNS ===== */
    .column {
      background: var(--white);
      border-radius: 16px;
      width: 340px;
      min-width: 280px;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(58, 54, 50, 0.08);
    }

    .column.wide { width: auto; flex: 1; min-width: 340px; }
    .column.narrow { width: 260px; min-width: 240px; }

    .column-header {
      padding: 14px 18px;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 18px;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .column-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .column-count {
      background: var(--primary);
      color: var(--white);
      border-radius: 10px;
      padding: 3px 10px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
    }

    .todo-filter {
      padding: 4px 8px;
      border: 1.5px solid var(--text-muted);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      background: var(--white);
      color: var(--text);
      cursor: pointer;
    }

    .card-list {
      padding: 10px 12px;
      overflow-y: auto;
      flex: 1;
    }

    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: var(--white);
      font-size: 20px;
      cursor: pointer;
      margin: 8px auto 10px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .add-btn:hover { background: var(--primary-dark); transform: scale(1.1); }

    /* ===== FORMS ===== */
    .form-container { display: none; padding: 0 14px 14px; }
    .form-container.active { display: block; }

    .form-container textarea,
    .form-container input,
    .form-container select {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 14px;
      background: var(--card-bg);
      color: var(--text);
      resize: none;
      transition: background 0.2s;
    }

    .form-container textarea:focus,
    .form-container input:focus,
    .form-container select:focus { outline: none; background: var(--card-hover); }
    .form-container textarea::placeholder,
    .form-container input::placeholder { color: var(--text-faint); }
    .form-container select { cursor: pointer; margin-top: 8px; }
    .form-container .btn { margin-top: 8px; width: 100%; }

    .assignee-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .assignee-chip {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--text-muted);
      background: var(--white);
      color: var(--text);
      font-family: var(--font-sans);
      transition: all 0.15s;
    }

    .assignee-chip:hover { border-color: var(--primary); }
    .assignee-chip.selected { background: var(--primary); color: var(--white); border-color: var(--primary); }
    .assignee-chip.all-chip.selected { background: var(--accent); border-color: var(--accent); color: var(--text); }

    /* ===== CARDS ===== */
    .card {
      background: rgba(52, 82, 79, 0.08);
      border-radius: 12px;
      padding: 12px 36px 12px 14px;
      margin-bottom: 10px;
      position: relative;
      transition: background 0.15s;
    }

    .card:hover { background: rgba(52, 82, 79, 0.12); }
    .card.completed { opacity: 0.6; }
    .card.completed .card-text { text-decoration: line-through; }

    .card-menu {
      position: absolute;
      top: 8px;
      right: 8px;
    }

    .card.card-new {
      border-left: 3px solid var(--primary);
    }

    .card.card-new:hover { background: rgba(52, 82, 79, 0.15); }

    .new-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: var(--primary);
      color: var(--white);
      padding: 1px 5px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
    }

    .card-link {
      color: var(--primary) !important;
      text-decoration: underline;
      word-break: break-all;
    }

    .card-link:hover {
      color: var(--primary-dark) !important;
    }

    .card.card-purchased { opacity: 0.5; }
    .card.card-purchased .card-text { text-decoration: line-through; }

    .card-menu-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s;
      line-height: 1;
    }

    .card:hover .card-menu-btn { opacity: 0.5; }
    .card-menu-btn:hover { opacity: 1 !important; background: rgba(52, 82, 79, 0.15); }
    .card.card-new .card-menu-btn:hover { background: rgba(52, 82, 79, 0.2); }

    .card-menu-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: var(--white);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      min-width: 100px;
      z-index: 10;
      overflow: hidden;
    }

    .card-menu-dropdown.open { display: block; }

    .card-menu-item {
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-family: var(--font-sans);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .card-menu-item:hover { background: var(--card-bg); }
    .card-menu-item.danger { color: var(--danger); }

    .card-edit-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-edit-form textarea,
    .card-edit-form input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--primary);
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 14px;
      background: var(--white);
      color: var(--text);
      resize: vertical;
    }

    .card-edit-form textarea:focus,
    .card-edit-form input:focus { outline: none; border-color: var(--accent); }

    .card-edit-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .card-edit-actions .btn { padding: 5px 12px; font-size: 12px; }

    .btn-edit-save { background: var(--primary); color: var(--white); }
    .btn-edit-cancel { background: transparent; border: 1.5px solid var(--text-muted); color: var(--text); }

    .card-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .todo-card-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .todo-checkbox {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      cursor: pointer;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .todo-card-body {
      flex: 1;
      min-width: 0;
    }

    .avatar-stack {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      margin-left: auto;
      gap: 1px;
      align-items: flex-end;
    }

    .avatar-row {
      display: flex;
      gap: 1px;
    }

    .avatar-stack .avatar {
      width: 26px;
      height: 26px;
      font-size: 10px;
      border: 2px solid var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }

    .avatar-stack .avatar:hover { transform: translateY(-2px); }

    .avatar-stack .avatar.done {
      border-color: var(--primary);
      background: var(--primary);
    }

    .avatar-stack .avatar.pending {
      border-color: var(--text-muted);
      opacity: 0.7;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      text-transform: uppercase;
      font-family: var(--font-sans);
    }

    .card-body { flex: 1; min-width: 0; }

    .card-text {
      font-size: 14px;
      word-break: break-word;
      line-height: 1.5;
    }

    .card-meta {
      font-size: 11px;
      color: var(--text);
      opacity: 0.5;
      margin-top: 5px;
    }

    .card-due-date {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      opacity: 0.8;
      margin-top: 5px;
    }

    .card-due-date.overdue {
      color: var(--danger);
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .tag {
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      background: var(--text-muted);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tag.all { background: var(--accent); color: var(--text); }

    .tag-check {
      width: 13px;
      height: 13px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    /* ===== PROGRESS BAR ===== */
    .progress-bar-container { margin-bottom: 8px; }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: var(--text-muted);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .progress-text {
      font-size: 11px;
      color: var(--text);
      opacity: 0.5;
      margin-top: 3px;
      text-align: center;
    }

    /* ===== GOAL BAR ===== */
    .goal-bar {
      padding: 10px 20px 0;
      flex-shrink: 0;
    }

    .goal-card {
      background: rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .goal-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.5);
      font-weight: 600;
    }

    .goal-input {
      width: 28px;
      padding: 1px 2px;
      border: none;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      color: var(--white);
      text-align: center;
      transition: all 0.15s;
      -moz-appearance: textfield;
    }

    .goal-input::-webkit-outer-spin-button,
    .goal-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .goal-input:hover {
      background: rgba(255,255,255,0.15);
    }

    .goal-input:focus {
      outline: none;
      background: rgba(255,255,255,0.25);
    }

    .goal-separator {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      font-weight: 600;
    }

    .goal-unit {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      font-weight: 600;
      margin-left: 1px;
    }

    .column-gap {
      height: 20px;
      border-top: 1px solid var(--border);
      margin: 0 14px;
    }

    .empty-state {
      text-align: center;
      padding: 24px;
      color: var(--text);
      opacity: 0.4;
      font-size: 14px;
      font-style: italic;
    }

    /* ===== GOAL BAR ===== */
    .goal-bar {
      padding: 10px 20px 0;
      flex-shrink: 0;
    }

    @media (max-width: 576px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        padding: 12px 16px;
        gap: 10px;
      }

      .header-left {
        width: 100%;
        justify-content: space-between;
      }

      header .date {
        font-size: 18px;
      }

      .shift-info {
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
      }

      .shift-field input[type="text"] { width: 70px; }
      .shift-field input[type="number"] { width: 50px; }
      .shift-field select { min-width: 60px; }

      .settings-btn { padding: 8px; }

      .board {
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 16px;
        gap: 16px;
      }

      .column {
        width: 100% !important;
        min-width: 0 !important;
        max-height: none;
        flex-shrink: 0;
      }

      .column.wide,
      .column.narrow {
        width: 100% !important;
        min-width: 0 !important;
      }

      .add-btn {
        width: 44px;
        height: 44px;
        font-size: 24px;
      }

      .card {
        padding: 14px 40px 14px 14px;
      }

      .card-menu-btn {
        padding: 8px 10px;
        font-size: 18px;
        opacity: 1;
      }

      .form-container { padding: 0 12px 12px; }
      .form-container textarea,
      .form-container input,
      .form-container select {
        padding: 12px;
        font-size: 16px;
      }

      .btn {
        padding: 12px 16px;
        font-size: 15px;
      }

      .modal {
        width: 95vw;
        padding: 20px;
      }

      footer {
        padding: 12px 16px;
      }

      .footer-links {
        flex-wrap: wrap;
        gap: 6px;
      }

      .toast {
        left: 16px;
        right: 16px;
        bottom: 16px;
      }
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary);
      color: var(--white);
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(58, 54, 50, 0.15);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      font-family: var(--font-sans);
      font-size: 14px;
    }

    .toast.show { transform: translateY(0); opacity: 1; }

    .toast-undo-btn {
      margin-left: 12px;
      background: none;
      border: 1px solid rgba(255,255,255,0.4);
      color: var(--white);
      padding: 2px 10px;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }

    .toast-undo-btn:hover { background: rgba(255,255,255,0.15); }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--white);
      border-radius: 16px;
      padding: 24px;
      width: 360px;
      max-width: 90vw;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .modal h3 {
      font-family: var(--font-serif);
      font-size: 18px;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .modal-employee-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .modal-employee-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .modal-employee-list li:last-child { border-bottom: none; }

    .modal-employee-list input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--text-muted);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 14px;
      background: var(--card-bg);
      color: var(--text);
    }

    .modal-employee-list input:focus { outline: none; border-color: var(--primary); }

    .modal-delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      opacity: 0.5;
      transition: opacity 0.15s;
    }

    .modal-copy-link {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 6px;
      opacity: 0.4;
      transition: opacity 0.15s;
    }

    .modal-copy-link:hover { opacity: 1; }

    .modal-delete-btn:hover { opacity: 1; }

    .modal-add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 8px;
      border: 1.5px dashed var(--text-muted);
      border-radius: 8px;
      background: none;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.15s;
    }

    .modal-add-btn:hover { border-color: var(--primary); color: var(--primary); }

    .modal-close {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-close:hover { background: var(--primary-dark); }

    /* ===== TASK PAGE ===== */
    .task-page {
      display: none;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }

    .task-page.active { display: flex; }

    .task-page-header {
      background: var(--primary);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .task-page-back {
      background: none;
      border: 1.5px solid rgba(255,255,255,0.3);
      color: var(--white);
      padding: 6px 14px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }

    .task-page-back:hover { background: rgba(255,255,255,0.15); }

    .task-page-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--white);
    }

    .task-page-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .task-page-item {
      background: var(--white);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(58,54,50,0.06);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .task-page-item.completed { opacity: 0.5; }
    .task-page-item.completed .task-page-text { text-decoration: line-through; }

    .task-page-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--primary);
      flex-shrink: 0;
    }

    .task-page-text {
      font-size: 14px;
      line-height: 1.5;
      flex: 1;
    }

    .task-page-meta {
      font-size: 11px;
      color: var(--text);
      opacity: 0.4;
      margin-top: 4px;
    }

    .task-page-due-date {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      opacity: 0.8;
      margin-top: 4px;
    }

    .task-page-due-date.overdue {
      color: var(--danger);
    }

    .task-page-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text);
      opacity: 0.4;
      font-size: 14px;
    }

    /* ===== BOARD CONTAINER ===== */
    .board-container {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    .board-container.active { display: flex; }
  </style>
</head>
<body>
  <div class="board-container active" id="boardContainer">
    <header>
      <div class="header-left">
        <div class="date" id="currentDate"></div>
        <button class="header-icon-btn" onclick="copySnapshot()" title="Copy to Clipboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
          </svg>
        </button>
        <button class="header-icon-btn" onclick="gmailSnapshot()" title="Send via Gmail">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </button>
        <div class="goal-card">
          <span class="goal-label">Goal</span>
          <input class="goal-input" type="number" id="goalCurrent" value="0" onchange="saveGoalValue('current', this.value)" />
          <span class="goal-separator">/</span>
          <input class="goal-input" type="number" id="goalTarget" value="45" onchange="saveGoalValue('target', this.value)" />
          <span class="goal-unit">k</span>
        </div>
      </div>
      <div class="header-right">
        <div class="shift-info">
          <div class="shift-field">
            <label>Folks:</label>
            <input type="text" id="folksWorking" placeholder="e.g., BBAE" onchange="autoSaveRegisters()" />
          </div>
          <div class="shift-divider"></div>
          <div class="shift-field">
            <label>Open:</label>
            <input type="number" id="registerOpen" value="250" onchange="autoSaveRegisters()" />
            <div class="assignee-dropdown" id="openAssigneeDropdown" onclick="toggleAssigneeDropdown('open')">
              <span class="assignee-dropdown-display" id="openAssigneeDisplay">--</span>
              <span class="assignee-dropdown-arrow">▾</span>
              <div class="assignee-dropdown-menu" id="openAssigneeMenu"></div>
            </div>
          </div>
          <div class="shift-field">
            <label>Close:</label>
            <input type="number" id="registerClose" value="250" onchange="autoSaveRegisters()" />
            <div class="assignee-dropdown" id="closeAssigneeDropdown" onclick="toggleAssigneeDropdown('close')">
              <span class="assignee-dropdown-display" id="closeAssigneeDisplay">--</span>
              <span class="assignee-dropdown-arrow">▾</span>
              <div class="assignee-dropdown-menu" id="closeAssigneeMenu"></div>
            </div>
          </div>
        </div>
        <button class="settings-btn" onclick="openSettings()" title="Manage Employees">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="board">
      <div class="column wide">
          <div class="column-header">
            <div class="column-header-left">
              Announcements
              <span class="column-count" id="annCount">0</span>
            </div>
            <select class="todo-filter" id="annFilter" onchange="render()">
              <option value="7" selected>Past 7 days</option>
              <option value="14">Past 14 days</option>
              <option value="30">Past 30 days</option>
              <option value="all">All</option>
            </select>
          </div>
        <div class="card-list" id="announcementList"></div>
        <button class="add-btn" onclick="toggleForm('ann')">+</button>
        <div class="form-container" id="annForm">
          <textarea id="announcementText" rows="2" placeholder="Add an announcement..."></textarea>
          <select id="announcementAuthor"></select>
          <button class="btn btn-primary btn-sm" onclick="addAnnouncement()">Add</button>
        </div>
      </div>

      <div class="column wide">
        <div class="column-header">
          <div class="column-header-left">
            To-Do List
            <span class="column-count" id="todoCount">0</span>
          </div>
          <select class="todo-filter" id="todoFilter" onchange="render()">
            <option value="all">All</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="card-list" id="todoList"></div>
        <button class="add-btn" onclick="toggleForm('todo')">+</button>
        <div class="form-container" id="todoForm">
          <textarea id="todoText" rows="2" placeholder="Add a task..."></textarea>
          <input type="date" id="todoDueDate" />
          <div class="assignee-selector" id="assigneeSelector"></div>
          <select id="todoAuthor"></select>
          <button class="btn btn-primary btn-sm" onclick="addTodo()">Add</button>
        </div>
      </div>

      <div class="column narrow">
        <div class="column-header">
          <div class="column-header-left">
            Events
            <span class="column-count" id="eventCount">0</span>
          </div>
        </div>
        <div class="card-list" id="eventList"></div>
        <button class="add-btn" onclick="toggleForm('event')">+</button>
        <div class="form-container" id="eventForm">
          <input type="text" id="eventText" placeholder="e.g., Tues 6/2: Liminal Library 6:30-7:30" />
          <button class="btn btn-primary btn-sm" style="margin-top:8px;width:100%" onclick="addEvent()">Add</button>
        </div>
        <div class="column-gap"></div>
        <div class="column-header">
          <div class="column-header-left">
            Shopping
            <span class="column-count" id="shopCount">0</span>
          </div>
          <select class="todo-filter" id="shopFilter" onchange="render()">
            <option value="all">All</option>
            <option value="purchased">Purchased</option>
          </select>
        </div>
        <div class="card-list" id="shoppingList"></div>
        <button class="add-btn" onclick="toggleForm('shop')">+</button>
        <div class="form-container" id="shopForm">
          <input type="text" id="shoppingItem" placeholder="Add item..." />
          <button class="btn btn-primary btn-sm" style="margin-top:8px;width:100%" onclick="addShoppingItem()">Add</button>
        </div>
        <div class="column-gap"></div>
        <div class="column-header">
          <div class="column-header-left">
            Faire
            <span class="column-count" id="faireCount">0</span>
          </div>
          <select class="todo-filter" id="faireFilter" onchange="render()">
            <option value="all">All</option>
            <option value="purchased">Purchased</option>
          </select>
        </div>
        <div class="card-list" id="faireList"></div>
        <button class="add-btn" onclick="toggleForm('faire')">+</button>
        <div class="form-container" id="faireForm">
          <input type="text" id="faireItem" placeholder="Add Faire item..." />
          <button class="btn btn-primary btn-sm" style="margin-top:8px;width:100%" onclick="addFaireItem()">Add</button>
        </div>
      </div>
    </div>

    <footer>
      <div class="sync-status" id="syncStatus" style="display:none">
        <span class="dot" id="syncDot"></span>
        <span id="syncText">Loading</span>
      </div>
      <div class="footer-links" id="footerLinks">
        <span class="footer-links-label">Important Links</span>
        <div id="footerLinksList"></div>
        <button class="footer-add-link" onclick="toggleFooterLinkForm()" title="Add link">+</button>
      </div>
    </footer>
    <div class="footer-link-form" id="footerLinkForm" style="display:none">
      <input type="text" id="footerLinkTitle" placeholder="Title" />
      <input type="text" id="footerLinkUrl" placeholder="https://..." />
      <button class="btn btn-sm btn-primary" onclick="addFooterLink()">Add</button>
      <button class="btn btn-sm btn-ghost" onclick="toggleFooterLinkForm()" style="color:var(--text);border-color:var(--text-muted)">Cancel</button>
    </div>
  </div>

  <div class="task-page" id="taskPage">
    <div class="task-page-header">
      <a class="task-page-back" href="?">← Back</a>
      <div class="task-page-title" id="taskPageTitle">My Tasks</div>
    </div>
    <div class="task-page-list" id="taskPageList"></div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h3>Manage Employees</h3>
      <ul class="modal-employee-list" id="employeeList"></ul>
      <button class="modal-add-btn" onclick="addEmployee()">+ Add Employee</button>
      <button class="modal-close" onclick="closeSettings()">Done</button>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button class="toast-undo-btn" id="toastUndoBtn" onclick="undoAction()">Undo</button>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLgjOxwmycVaPEqffmTYGzDsyheWT9vjv17Gwq0ojOn49GPwX6lYGzxq-UGzcERmNIyg/exec';
    const DEFAULT_EMPLOYEES = ['Ash E', 'Brett B', 'Dom W', 'Emma F', 'Emily Z', 'Lena B'];

    let employeesUpdatedAt = 0;

    let state = {
      employees: [...DEFAULT_EMPLOYEES],
      announcements: [],
      todos: [],
      dailyInfo: {
        folks_working: '',
        register_open: 250,
        register_close: 250,
        open_assignee: '',
        close_assignee: '',
        monthly_goal_current: 0,
        monthly_goal_target: 45000,
        shopping_list: [],
        faire_list: [],
        events: [],
        important_links: []
      },
      selectedAssignees: []
    };

    let cloudSaving = false;
    let cloudSaveQueue = [];

    const urlParams = new URLSearchParams(window.location.search);
    let taskUser = urlParams.get('user');

    function resolveEmployee(displayName) {
      if (!displayName) return '';
      if (state.employees.includes(displayName)) return displayName;
      return state.employees.find(e => getFirstName(e) === displayName) || displayName;
    }

    if (taskUser) {
      document.getElementById('boardContainer').classList.remove('active');
      document.getElementById('taskPage').classList.add('active');
    }

    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    loadData();

    function getInitials(name) {
      const parts = name.trim().split(' ');
      if (parts.length === 1) {
        return name.substring(0, 2).toUpperCase();
      }
      return parts.map(w => w[0]).join('').substring(0, 2).toUpperCase();
    }

    function getFirstName(name) {
      return name.split(' ')[0];
    }

    function generateEmployeeOptions(selected, displayFn) {
      return '<option value="">--</option>' + state.employees.map(e =>
        `<option value="${e}" ${e === selected ? 'selected' : ''}>${displayFn ? displayFn(e) : e}</option>`
      ).join('');
    }

    function generateAssigneeChips() {
      return `<span class="assignee-chip all-chip" data-value="All" onclick="toggleAssignee(this)">All</span>` +
        state.employees.map(e =>
          `<span class="assignee-chip" data-value="${e}" onclick="toggleAssignee(this)">${getFirstName(e)}</span>`
        ).join('');
    }

    function updateAllDropdowns() {
      renderAssigneeDropdown('open', state.dailyInfo.open_assignee);
      renderAssigneeDropdown('close', state.dailyInfo.close_assignee);
      document.getElementById('announcementAuthor').innerHTML = generateEmployeeOptions('', getFirstName);
      document.getElementById('todoAuthor').innerHTML = generateEmployeeOptions('', getFirstName);
      document.getElementById('assigneeSelector').innerHTML = generateAssigneeChips();

      const currentFilter = document.getElementById('todoFilter').value;
      document.getElementById('todoFilter').innerHTML =
        '<option value="all">Active</option>' +
        '<option value="completed" ' + (currentFilter === 'completed' ? 'selected' : '') + '>Completed</option>' +
        state.employees.map(e =>
          `<option value="${e}" ${e === currentFilter ? 'selected' : ''}>${getFirstName(e)}</option>`
        ).join('');
    }

    function renderAssigneeDropdown(type, selected) {
      const displayEl = document.getElementById(`${type}AssigneeDisplay`);
      const menuEl = document.getElementById(`${type}AssigneeMenu`);

      displayEl.textContent = selected ? getInitials(selected) : '--';

      menuEl.innerHTML = `<div class="assignee-dropdown-item ${!selected ? 'selected' : ''}" onclick="event.stopPropagation(); selectAssignee('${type}', '')">--</div>` +
        state.employees.map(e =>
          `<div class="assignee-dropdown-item ${e === selected ? 'selected' : ''}" onclick="event.stopPropagation(); selectAssignee('${type}', '${e}')">${getInitials(e)}</div>`
        ).join('');
    }

    function toggleAssigneeDropdown(type) {
      const menuEl = document.getElementById(`${type}AssigneeMenu`);
      const isOpen = menuEl.classList.contains('open');
      document.querySelectorAll('.assignee-dropdown-menu').forEach(m => m.classList.remove('open'));
      if (!isOpen) menuEl.classList.add('open');
    }

    function selectAssignee(type, value) {
      if (type === 'open') state.dailyInfo.open_assignee = value;
      else state.dailyInfo.close_assignee = value;
      renderAssigneeDropdown(type, value);
      document.querySelectorAll('.assignee-dropdown-menu').forEach(m => m.classList.remove('open'));
      autoSaveRegisters();
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.assignee-dropdown')) {
        document.querySelectorAll('.assignee-dropdown-menu').forEach(m => m.classList.remove('open'));
      }
    });

    function toggleForm(type) {
      const formMap = { ann: 'annForm', todo: 'todoForm', shop: 'shopForm', event: 'eventForm', faire: 'faireForm' };
      const formId = formMap[type];
      const form = document.getElementById(formId);
      const isActive = form.classList.contains('active');

      document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));

      if (!isActive) {
        form.classList.add('active');
        const textarea = form.querySelector('textarea, input');
        if (textarea) setTimeout(() => textarea.focus(), 50);
      }
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.form-container') && !e.target.closest('.add-btn')) {
        document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
      }
    });

    function toggleCardMenu(btn) {
      const dropdown = btn.nextElementSibling;
      const isOpen = dropdown.classList.contains('open');
      document.querySelectorAll('.card-menu-dropdown').forEach(d => d.classList.remove('open'));
      if (!isOpen) dropdown.classList.add('open');
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.card-menu')) {
        document.querySelectorAll('.card-menu-dropdown').forEach(d => d.classList.remove('open'));
      }
    });

    function updateSyncStatus(type) {
      const syncEl = document.getElementById('syncStatus');
      const syncTextEl = document.getElementById('syncText');
      const syncDot = document.getElementById('syncDot');
      syncEl.style.display = 'flex';
      if (type === 'cloud') {
        syncTextEl.textContent = 'Synced';
        syncDot.className = 'dot cloud';
      } else if (type === 'error') {
        syncTextEl.textContent = 'Sync failed';
        syncDot.className = 'dot error';
      } else {
        syncTextEl.textContent = 'Local';
        syncDot.className = 'dot local';
      }
    }

    function loadFromLocal() {
      const local = localStorage.getItem('shiftNote');
      if (local) {
        const parsed = JSON.parse(local);
        employeesUpdatedAt = parsed.employeesUpdatedAt || 0;
        const cloudEmps = parsed.employees || [...DEFAULT_EMPLOYEES];
        if (cloudEmps._updatedAt) {
          employeesUpdatedAt = Math.max(employeesUpdatedAt, cloudEmps._updatedAt);
          delete cloudEmps._updatedAt;
        }
        state.employees = cloudEmps;
        state.announcements = parsed.announcements || [];
        state.todos = (parsed.todos || []).map(t => {
          if (t.completions) return t;
          const completions = {};
          t.assignees.forEach(a => completions[a] = false);
          return { ...t, completions };
        });
        state.dailyInfo = { ...state.dailyInfo, ...parsed.dailyInfo };
        return true;
      }
      return false;
    }

    function loadData() {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('YOUR_APPS_SCRIPT')) {
        loadFromLocal();
        updateAllDropdowns();
        render();
        updateSyncStatus('local');
        return;
      }

      const hasLocal = loadFromLocal();
      if (hasLocal) {
        updateAllDropdowns();
        render();
        updateSyncStatus('local');
      }

      if (window.location.protocol === 'https:' || window.location.protocol === 'http:') {
        fetch(APPS_SCRIPT_URL + '?t=' + Date.now(), { cache: 'no-store' })
          .then(res => res.json())
          .then(handleCloudData)
          .catch(() => {
            if (!hasLocal) { updateAllDropdowns(); render(); }
            updateSyncStatus('error');
          });
      } else {
        const script = document.createElement('script');
        script.src = APPS_SCRIPT_URL + '?callback=handleCloudData&t=' + Date.now();
        script.onerror = function() {
          if (!hasLocal) { updateAllDropdowns(); render(); }
          updateSyncStatus('error');
        };
        document.body.appendChild(script);
      }
    }

    function handleCloudData(data) {
      const cloudAnn = data.announcements || [];
      const cloudTodos = (data.todos || []).map(t => {
        if (t.completions) return t;
        const completions = {};
        t.assignees.forEach(a => completions[a] = false);
        return { ...t, completions };
      });
      const cloudDaily = data.dailyInfo || {};
      const cloudEmployees = data.employees || [...DEFAULT_EMPLOYEES];
      // Always prefer cloud employees since the sheet is the source of truth
      if (data.employees) {
        state.employees = cloudEmployees;
        employeesUpdatedAt = data.employeesUpdatedAt || Date.now();
      }

      // Cloud is source of truth for announcements and todos
      if (data.announcements) {
        state.announcements = cloudAnn;
      }
      if (data.todos) {
        state.todos = cloudTodos;
      }

      // Handle new dailyInfo format (field names changed)
      if (data.dailyInfo) {
        state.dailyInfo.folks_working = cloudDaily.folks_working || cloudDaily.folksWorking || '';
        state.dailyInfo.register_open = cloudDaily.register_open || cloudDaily.registerOpen || 250;
        state.dailyInfo.register_close = cloudDaily.register_close || cloudDaily.registerClose || 250;
        state.dailyInfo.open_assignee = cloudDaily.open_assignee || cloudDaily.openAssignee || '';
        state.dailyInfo.close_assignee = cloudDaily.close_assignee || cloudDaily.closeAssignee || '';
        state.dailyInfo.monthly_goal_current = cloudDaily.monthly_goal_current || cloudDaily.monthlyGoalCurrent || 0;
        state.dailyInfo.monthly_goal_target = cloudDaily.monthly_goal_target || cloudDaily.monthlyGoalTarget || 45000;
      }

      // Handle separate lists from new format
      if (data.shoppingList) {
        state.dailyInfo.shopping_list = data.shoppingList.map(i => ({
          id: i.id,
          content: i.content,
          purchased: i.purchased === true || i.purchased === 'true'
        }));
      }
      if (data.faireList) {
        state.dailyInfo.faire_list = data.faireList.map(i => ({
          id: i.id,
          content: i.content,
          purchased: i.purchased === true || i.purchased === 'true'
        }));
      }
      if (data.importantLinks) {
        state.dailyInfo.important_links = data.importantLinks;
      }
      if (data.events) {
        state.dailyInfo.events = data.events;
      }

      saveToLocal();
      updateAllDropdowns();
      render();
      if (taskUser) renderTaskPage();
      updateSyncStatus('cloud');
    }

    async function saveToCloud(action, id, item) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('YOUR_APPS_SCRIPT')) return;
      cloudSaveQueue.push({ action, id, item });
      if (cloudSaving) return;
      cloudSaving = true;

      while (cloudSaveQueue.length > 0) {
        const op = cloudSaveQueue.shift();
        try {
          const payload = JSON.stringify({
            action: op.action,
            id: op.id,
            item: op.item
          });
          await fetch(APPS_SCRIPT_URL + '?t=' + Date.now(), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: payload
          });
          updateSyncStatus('cloud');
        } catch (e) {
          console.error('Cloud save failed:', e);
          updateSyncStatus('error');
        }
      }
      cloudSaving = false;
    }

          document.querySelectorAll('.assignee-chip').forEach(c => c.classList.remove('selected'));
        } else {

          document.querySelectorAll('.assignee-chip').forEach(c => c.classList.remove('selected'));

      } else {

    function render() {
      if (taskUser) {
        taskUser = resolveEmployee(taskUser);
        document.getElementById('taskPageTitle').textContent = `${getFirstName(taskUser)}'s Tasks`;
      }

      document.getElementById('folksWorking').value = state.dailyInfo.folks_working || '';
      document.getElementById('registerOpen').value = state.dailyInfo.register_open || 250;
      document.getElementById('registerClose').value = state.dailyInfo.register_close || 250;
      document.getElementById('goalCurrent').value = Math.round((state.dailyInfo.monthly_goal_current || 0) / 1000);
      document.getElementById('goalTarget').value = Math.round((state.dailyInfo.monthly_goal_target || 45000) / 1000);
      renderAssigneeDropdown('open', state.dailyInfo.open_assignee || '');
      renderAssigneeDropdown('close', state.dailyInfo.close_assignee || '');

      const annFilter = document.getElementById('annFilter').value;
      const annCutoff = annFilter === 'all' ? 0 : Date.now() - (parseInt(annFilter) * 86400000);
      const filteredAnns = annFilter === 'all'
        ? state.announcements
        : state.announcements.filter(a => new Date(a.timestamp).getTime() >= annCutoff);

      const annList = document.getElementById('announcementList');
      document.getElementById('annCount').textContent = filteredAnns.length;

      const isNew = (a) => (Date.now() - new Date(a.timestamp).getTime()) < 3 * 86400000;

      const annHtml = filteredAnns.length === 0
        ? '<div class="empty-state">' + (annFilter === 'all' ? 'No announcements yet' : 'No announcements in this period') + '</div>'
        : filteredAnns.map(a => {
          const recent = isNew(a);
          return `
          <div class="card ${recent ? 'card-new' : ''}" data-id="${a.id}">
            <div class="card-row">
              <div class="avatar">${getInitials(a.author)}</div>
              <div class="card-body">
                <div class="card-text">${parseMarkdown(a.content)}</div>
                <div class="card-meta">${recent ? '<span class="new-tag">NEW</span>' : ''}${getFirstName(a.author)} - ${formatTime(a.timestamp)}</div>
              </div>
            </div>
            <div class="card-menu">
              <button class="card-menu-btn" onclick="event.stopPropagation(); toggleCardMenu(this)">⋮</button>
              <div class="card-menu-dropdown">
                <button class="card-menu-item" onclick="event.stopPropagation(); editAnnouncement('${a.id}')">✎ Edit</button>
                <button class="card-menu-item danger" onclick="event.stopPropagation(); deleteAnnouncement('${a.id}')">✕ Delete</button>
              </div>
            </div>
          </div>
        `;
        }).join('');

      annList.innerHTML = annHtml;

      const filter = document.getElementById('todoFilter').value;
      const filterResolved = filter !== 'all' && filter !== 'completed' ? resolveEmployee(filter) : '';
      let filteredTodos;

      if (filter === 'completed') {
        filteredTodos = state.todos.filter(t => isTodoComplete(t));
      } else {
        filteredTodos = filter === 'all'
          ? state.todos.filter(t => !isTodoComplete(t))
          : state.todos.filter(t => t.assignees.includes(filterResolved) || t.assignees.includes('All'));
      }

      // Sort: incomplete by due date first, then completed at bottom
      filteredTodos.sort((a, b) => {
        const aComplete = isTodoComplete(a);
        const bComplete = isTodoComplete(b);
        if (aComplete !== bComplete) return aComplete ? 1 : -1;
        // Both same completion state - sort by due date
        if (!a.dueDate && !b.dueDate) return 0;
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return a.dueDate.localeCompare(b.dueDate);
      });

      const todoList = document.getElementById('todoList');
      document.getElementById('todoCount').textContent = filteredTodos.length;
      if (filteredTodos.length === 0) {
        const emptyMsg = filter === 'completed' ? 'No completed tasks' : (filter === 'all' ? 'No active tasks' : `No tasks for ${filter}`);
        todoList.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
      } else {
        todoList.innerHTML = filteredTodos.map(t => {
          const complete = isTodoComplete(t);
          const done = getCompletionCount(t);
          const total = t.assignees.includes('All') ? state.employees.length : t.assignees.length;
          const pct = total > 0 ? (done / total) * 100 : 0;

          const filterChecked = filterResolved ? (t.completions && t.completions[filterResolved]) : complete;
          const filterCheckboxHtml = filterResolved
            ? `<input type="checkbox" class="todo-checkbox" ${filterChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCompletion('${t.id}', '${filterResolved}')" />`
            : `<input type="checkbox" class="todo-checkbox" ${complete ? 'checked' : ''} onclick="event.stopPropagation(); toggleTodoCompletion('${t.id}')" />`;

          const displayAssignees = t.assignees.includes('All')
            ? state.employees
            : t.assignees;

          const perRow = displayAssignees.length <= 3 ? displayAssignees.length : Math.ceil(displayAssignees.length / 2);
          const rows = [];
          for (let i = 0; i < displayAssignees.length; i += perRow) {
            rows.push(displayAssignees.slice(i, i + perRow));
          }

          const avatarsHtml = rows.map(row => {
            return `<div class="avatar-row">${row.map(a => {
              const isDone = t.completions && t.completions[a];
              return `<div class="avatar ${isDone ? 'done' : 'pending'}"
                   onclick="event.stopPropagation(); toggleCompletion('${t.id}', '${a}')"
                   title="${getFirstName(a)}: ${isDone ? 'Done' : 'Pending'}">
                ${getInitials(a)}
              </div>`;
            }).join('')}</div>`;
          }).join('');

            const progressText = total > 1 ? `<div class="progress-text">${done}/${total} completed</div>` : '';

           const dueDateHtml = t.dueDate ? `<div class="card-due-date ${isOverdue(t.dueDate) && !complete ? 'overdue' : ''}">Due ${formatDueDate(t.dueDate)}</div>` : '';
           const taskRecent = (Date.now() - new Date(t.timestamp).getTime()) < 3 * 86400000;

          return `
            <div class="card ${complete ? 'completed' : ''} ${taskRecent ? 'card-new' : ''}" data-id="${t.id}">
              <div class="todo-card-row">
                ${filterCheckboxHtml}
                <div class="todo-card-body">
                  <div class="card-text">${parseMarkdown(t.content)}</div>
                  ${dueDateHtml}
                  <div class="card-meta">${taskRecent ? '<span class="new-tag">NEW</span>' : ''}Added by ${getFirstName(t.author)} - ${formatTime(t.timestamp)}</div>
                </div>
                <div class="avatar-stack">${avatarsHtml}${progressText}</div>
              </div>
              <div class="card-menu">
                <button class="card-menu-btn" onclick="event.stopPropagation(); toggleCardMenu(this)">⋮</button>
                <div class="card-menu-dropdown">
                  <button class="card-menu-item" onclick="event.stopPropagation(); editTodo('${t.id}')">✎ Edit</button>
                  <button class="card-menu-item danger" onclick="event.stopPropagation(); deleteTodo('${t.id}')">✕ Delete</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      const shopFilter = document.getElementById('shopFilter').value;
      const filteredShop = shopFilter === 'purchased'
        ? state.dailyInfo.shopping_list.filter(i => i.purchased)
        : state.dailyInfo.shopping_list.filter(i => !i.purchased);

      const shopList = document.getElementById('shoppingList');
      document.getElementById('shopCount').textContent = state.dailyInfo.shopping_list.filter(i => !i.purchased).length;
      if (filteredShop.length === 0) {
        shopList.innerHTML = '<div class="empty-state">' + (shopFilter === 'purchased' ? 'No purchased items' : 'Shopping list is empty') + '</div>';
      } else {
        shopList.innerHTML = filteredShop.map(i => `
          <div class="card ${i.purchased ? 'card-purchased' : ''}" data-id="${i.id}">
            <div class="todo-card-row">
              <input type="checkbox" class="todo-checkbox" ${i.purchased ? 'checked' : ''} onclick="event.stopPropagation(); toggleShoppingItem('${i.id}')" />
              <div class="todo-card-body">
                <div class="card-text">${escapeHtml(i.content)}</div>
              </div>
            </div>
            <div class="card-menu">
              <button class="card-menu-btn" onclick="event.stopPropagation(); toggleCardMenu(this)">⋮</button>
              <div class="card-menu-dropdown">
                <button class="card-menu-item" onclick="event.stopPropagation(); editShoppingItem('${i.id}')">✎ Edit</button>
                <button class="card-menu-item danger" onclick="event.stopPropagation(); removeShoppingItem('${i.id}')">✕ Delete</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      const faireFilter = document.getElementById('faireFilter').value;
      const filteredFaire = faireFilter === 'purchased'
        ? state.dailyInfo.faire_list.filter(i => i.purchased)
        : state.dailyInfo.faire_list.filter(i => !i.purchased);

      const faireList = document.getElementById('faireList');
      document.getElementById('faireCount').textContent = state.dailyInfo.faire_list.filter(i => !i.purchased).length;
      if (filteredFaire.length === 0) {
        faireList.innerHTML = '<div class="empty-state">' + (faireFilter === 'purchased' ? 'No purchased items' : 'Faire list is empty') + '</div>';
      } else {
        faireList.innerHTML = filteredFaire.map(i => `
          <div class="card ${i.purchased ? 'card-purchased' : ''}" data-id="${i.id}">
            <div class="todo-card-row">
              <input type="checkbox" class="todo-checkbox" ${i.purchased ? 'checked' : ''} onclick="event.stopPropagation(); toggleFaireItem('${i.id}')" />
              <div class="todo-card-body">
                <div class="card-text">${escapeHtml(i.content)}</div>
              </div>
            </div>
            <div class="card-menu">
              <button class="card-menu-btn" onclick="event.stopPropagation(); toggleCardMenu(this)">⋮</button>
              <div class="card-menu-dropdown">
                <button class="card-menu-item" onclick="event.stopPropagation(); editFaireItem('${i.id}')">✎ Edit</button>
                <button class="card-menu-item danger" onclick="event.stopPropagation(); removeFaireItem('${i.id}')">✕ Delete</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      const evtList = document.getElementById('eventList');
      document.getElementById('eventCount').textContent = state.dailyInfo.events.length;
      if (state.dailyInfo.events.length === 0) {
        evtList.innerHTML = '<div class="empty-state">No upcoming events</div>';
      } else {
        evtList.innerHTML = state.dailyInfo.events.map(i => `
          <div class="card" data-id="${i.id}">
            <div class="card-text">${escapeHtml(i.content)}</div>
            <div class="card-menu">
              <button class="card-menu-btn" onclick="event.stopPropagation(); toggleCardMenu(this)">⋮</button>
              <div class="card-menu-dropdown">
                <button class="card-menu-item" onclick="event.stopPropagation(); editEvent('${i.id}')">✎ Edit</button>
                <button class="card-menu-item danger" onclick="event.stopPropagation(); removeEvent('${i.id}')">✕ Delete</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      renderFooterLinks();
    }

    function renderTaskPage() {
      const list = document.getElementById('taskPageList');
      let userTodos = state.todos.filter(t => t.assignees.includes(taskUser) || t.assignees.includes('All'));

      // Sort by due date: soonest first, no due date last
      userTodos.sort((a, b) => {
        if (!a.dueDate && !b.dueDate) return 0;
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return a.dueDate.localeCompare(b.dueDate);
      });

      if (userTodos.length === 0) {
        list.innerHTML = '<div class="task-page-empty">No tasks assigned to you</div>';
        return;
      }

      list.innerHTML = userTodos.map(t => {
        const complete = isTodoComplete(t);
        const done = getCompletionCount(t);
        const total = t.assignees.includes('All') ? state.employees.length : t.assignees.length;
        const userDone = t.completions && t.completions[taskUser];
        const dueDateHtml = t.dueDate ? `<div class="task-page-due-date ${isOverdue(t.dueDate) && !complete ? 'overdue' : ''}">Due ${formatDueDate(t.dueDate)}</div>` : '';

        return `
          <div class="task-page-item ${complete ? 'completed' : ''}">
            <input type="checkbox" ${userDone ? 'checked' : ''} onchange="toggleCompletion('${t.id}', '${taskUser}')" />
            <div>
              <div class="task-page-text">${parseMarkdown(t.content)}</div>
              ${dueDateHtml}
              <div class="task-page-meta">${done} of ${total} people completed</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function generateSnapshotText() {
      let body = '';

      body += `FOLKS WORKING: ${state.dailyInfo.folks_working || 'Not set'}\n`;
      body += `OPENING: $${state.dailyInfo.register_open || 250} (${state.dailyInfo.open_assignee || '--'})\n`;
      body += `CLOSING: $${state.dailyInfo.register_close || 250} (${state.dailyInfo.close_assignee || '--'})\n`;
      body += `MONTHLY GOAL: $${formatGoal(state.dailyInfo.monthly_goal_current || 0)} / $${formatGoal(state.dailyInfo.monthly_goal_target || 45000)}\n`;

      if (state.dailyInfo.important_links.length > 0) {
        body += `\nIMPORTANT LINKS:\n${'-'.repeat(30)}\n`;
        state.dailyInfo.important_links.forEach(l => {
          body += `• ${l.title} (${l.url})\n`;
        });
      }

      const sevenDaysAgo = new Date();
      sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
      const recentAnnouncements = state.announcements.filter(a => {
        if (!a.timestamp) return false;
        return new Date(a.timestamp) >= sevenDaysAgo;
      });

      body += `\nANNOUNCEMENTS:\n${'-'.repeat(30)}\n`;
      recentAnnouncements.forEach(a => {
        body += `• ${a.content} (${getFirstName(a.author)})\n`;
      });
      if (recentAnnouncements.length === 0) body += '(none)\n';

      body += `\nTO-DO LIST:\n${'-'.repeat(30)}\n`;
      const activeTodos = state.todos.filter(t => {
        const done = getCompletionCount(t);
        const assignees = t.assignees.includes('All') ? state.employees : t.assignees;
        return done < assignees.length;
      });
      activeTodos.forEach(t => {
        const done = getCompletionCount(t);
        const assignees = t.assignees.includes('All') ? state.employees : t.assignees;
        const total = assignees.length;
        const assigneeNames = assignees.map(a => getFirstName(a)).join(', ');
        body += `• [${done}/${total}] [${assigneeNames}] ${t.content} (by ${getFirstName(t.author)})\n`;
      });
      if (activeTodos.length === 0) body += '(none)\n';

      body += `\nSHOPPING LIST:\n${'-'.repeat(30)}\n`;
      const unpurchased = state.dailyInfo.shopping_list.filter(i => !i.purchased);
      unpurchased.forEach(i => {
        body += `• ${i.content}\n`;
      });
      if (unpurchased.length === 0) body += '(empty)\n';

      body += `\nFAIRE:\n${'-'.repeat(30)}\n`;
      const unpurchasedFaire = state.dailyInfo.faire_list.filter(i => !i.purchased);
      unpurchasedFaire.forEach(i => {
        body += `• ${i.content}\n`;
      });
      if (unpurchasedFaire.length === 0) body += '(empty)\n';

      body += `\nUPCOMING EVENTS:\n${'-'.repeat(30)}\n`;
      state.dailyInfo.events.forEach(i => {
        body += `• ${i.content}\n`;
      });
      if (state.dailyInfo.events.length === 0) body += '(none)\n';

      body += `\n${'-'.repeat(30)}\n`;
      body += `📍 ${window.location.origin}${window.location.pathname}\n`;

      return body;
    }

    function emailSnapshot() {
      const text = generateSnapshotText();
      const now = new Date();
      const day = now.toLocaleDateString('en-US', { weekday: 'short' });
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const yy = String(now.getFullYear()).slice(-2);
      const subject = encodeURIComponent(`Shift Note — ${day} ${m}/${d}/${yy}`);
      const bodyEncoded = encodeURIComponent(text);
      const mailtoLink = `mailto:?subject=${subject}&body=${bodyEncoded}`;

      const a = document.createElement('a');
      a.href = mailtoLink;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function copySnapshot() {
      const text = generateSnapshotText();
      navigator.clipboard.writeText(text).then(() => {
        showToast('Snapshot copied to clipboard');
      });
    }

    function gmailSnapshot() {
      const text = generateSnapshotText();
      const now = new Date();
      const day = now.toLocaleDateString('en-US', { weekday: 'short' });
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const yy = String(now.getFullYear()).slice(-2);
      const subject = encodeURIComponent(`Shift Note — ${day} ${m}/${d}/${yy}`);
      const body = encodeURIComponent(text);
      window.open(`https://mail.google.com/mail/?view=cm&su=${subject}&body=${body}`, '_blank');
    }

    function openSettings() {
      document.getElementById('settingsModal').classList.add('active');
      renderEmployeeList();
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('active');
      saveAll();
      updateAllDropdowns();
      render();
    }

    function renderEmployeeList() {
      const list = document.getElementById('employeeList');
      list.innerHTML = state.employees.map((e, i) => `
        <li>
          <input type="text" value="${escapeHtml(e)}" onchange="updateEmployee(${i}, this.value)" />
          <button class="modal-copy-link" onclick="copyTaskLink('${getFirstName(e)}')" title="Copy task link">🔗</button>
          <button class="modal-delete-btn" onclick="deleteEmployee(${i})">&times;</button>
        </li>
        `).join('');
    }

    function updateEmployee(index, newName) {
      const trimmed = newName.trim();
      if (!trimmed) return;
      const oldName = state.employees[index];
      state.employees[index] = trimmed;

      state.todos.forEach(t => {
        t.assignees = t.assignees.map(a => a === oldName ? trimmed : a);
        if (t.completions) {
          t.completions[trimmed] = t.completions[oldName];
          delete t.completions[oldName];
        }
      });
    }

    function addEmployee() {
      const name = prompt('Employee name:');
      if (name && name.trim()) {
        const id = String(state.employees.length + 1);
        const item = { id, name: name.trim(), createdAt: new Date().toISOString() };
        state.employees.push(item.name);
        saveToCloud('addEmployee', null, item);
        renderEmployeeList();
      }
    }

    function deleteEmployee(index) {
      if (state.employees.length <= 1) {
        showToast('Need at least one employee');
        return;
      }
      if (confirm(`Remove ${state.employees[index]}?`)) {
        const removed = state.employees[index];
        state.employees.splice(index, 1);
        saveToCloud('deleteEmployee', String(index + 1), null);

        state.todos.forEach(t => {
          t.assignees = t.assignees.filter(a => a !== removed);
          if (t.completions) delete t.completions[removed];
        });

        renderEmployeeList();
      }
    }

    function addFooterLink() {
      const title = document.getElementById('footerLinkTitle').value.trim();
      const url = document.getElementById('footerLinkUrl').value.trim();
      if (!title || !url) { showToast('Fill in title and URL'); return; }
      const item = { id: Date.now().toString(), title, url };
      state.dailyInfo.important_links.push(item);
      saveAll();
      saveToCloud('addLink', null, item);
      document.getElementById('footerLinkTitle').value = '';
      document.getElementById('footerLinkUrl').value = '';
      toggleFooterLinkForm();
      renderFooterLinks();
    }

    function removeFooterLink(id) {
      state.dailyInfo.important_links = state.dailyInfo.important_links.filter(l => l.id !== id);
      saveAll();
      saveToCloud('deleteLink', id, null);
      renderFooterLinks();
    }

    function renderFooterLinks() {
      const list = document.getElementById('footerLinksList');
      list.innerHTML = state.dailyInfo.important_links.map(l => `
        <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener" class="footer-link">${escapeHtml(l.title)}</a>
        <button class="footer-link-delete" onclick="removeFooterLink('${l.id}')" title="Remove">&times;</button>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function parseMarkdown(text) {
      const escaped = escapeHtml(text);
      // Convert [text](url) to links
      const markdownLinkRegex = /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g;
      let result = escaped.replace(markdownLinkRegex, '<a href="$2" target="_blank" rel="noopener" class="card-link">$1</a>');
      // Auto-detect raw URLs that aren't already in markdown links
      const urlRegex = /(?<!href=")(https?:\/\/[^\s<]+)/g;
      result = result.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener" class="card-link">$1</a>');
      return result;
    }

    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    function formatDueDate(dateStr) {
      const due = new Date(dateStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);

      if (due.getTime() === today.getTime()) return 'today';
      if (due.getTime() === tomorrow.getTime()) return 'tomorrow';

      return due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function isOverdue(dateStr) {
      const due = new Date(dateStr + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return due.getTime() < today.getTime();
    }

    let undoState = null;
    let undoTimeout = null;

    function formatGoal(num) {
      const n = parseInt(num) || 0;
      if (n >= 1000) return (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k';
      return n.toString();
    }

    function copyTaskLink(name) {
      const url = window.location.origin + window.location.pathname + '?user=' + encodeURIComponent(name);
      navigator.clipboard.writeText(url).then(() => {
        showToast('Link copied for ' + name);
      });
    }

    function toggleFooterLinkForm() {
      const form = document.getElementById('footerLinkForm');
      form.style.display = form.style.display === 'none' ? 'flex' : 'none';
      if (form.style.display === 'flex') {
        document.getElementById('footerLinkTitle').focus();
      }
    }

    function saveDailyInfoToCloud() {
      const item = {
        folksWorking: state.dailyInfo.folks_working || '',
        registerOpen: state.dailyInfo.register_open || 250,
        registerClose: state.dailyInfo.register_close || 250,
        openAssignee: state.employees.indexOf(state.dailyInfo.open_assignee) + 1 || '',
        closeAssignee: state.employees.indexOf(state.dailyInfo.close_assignee) + 1 || '',
        monthlyGoalCurrent: state.dailyInfo.monthly_goal_current || 0,
        monthlyGoalTarget: state.dailyInfo.monthly_goal_target || 45000,
        updatedAt: Date.now()
      };
      saveToCloud('saveDailyInfo', null, item);
    }

    function saveGoalValue(field, value) {
      const num = (parseInt(value) || 0) * 1000;
      if (field === 'current') state.dailyInfo.monthly_goal_current = num;
      else state.dailyInfo.monthly_goal_target = num;
      saveAll();
      saveDailyInfoToCloud();
      render();
      showToast('Goal updated');
    }

    function showToast(msg, undoFn) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toastMsg');
      const undoBtn = document.getElementById('toastUndoBtn');
      msgEl.textContent = msg;

      if (undoFn) {
        undoState = undoFn;
        undoBtn.style.display = 'inline-block';
      } else {
        undoState = null;
        undoBtn.style.display = 'none';
      }

      if (undoTimeout) clearTimeout(undoTimeout);
      toast.classList.add('show');
      undoTimeout = setTimeout(() => {
        toast.classList.remove('show');
        undoState = null;
      }, 5000);
    }

    function undoAction() {
      if (undoState) {
        undoState();
        undoState = null;
        if (undoTimeout) clearTimeout(undoTimeout);
        document.getElementById('toast').classList.remove('show');
      }
    }
  </script>
</body>
